<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      No unsafe-inline/unsafe-eval on script-src: this app never injects
      remote or dynamic script. style-src keeps unsafe-inline because Fluent
      UI (Griffel) injects <style> tags at runtime - blocking it breaks the
      whole UI, and there's no server here to hand out a nonce.
      connect-src covers: same-origin API calls, the packaged CLI's local
      proxy (localhost:4174) and dev-mode backend (localhost:3001), and the
      Entra ID / Graph endpoints used by the optional SWA auth mode and the
      "Send by email" Graph mail flow.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:4174 http://localhost:3001 https://login.microsoftonline.com https://graph.microsoft.com; frame-src https://login.microsoftonline.com; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <title>QA Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
