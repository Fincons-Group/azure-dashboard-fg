name: Lint

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - run: npm run lint

  # Mirrors publish-package.yml's steps exactly (same Node version, same
  # commands) so a package-build regression (e.g. a strict-mode TS error
  # that only reproduces on Linux, not a contributor's Windows/macOS
  # machine) is caught on the PR instead of only at tag-push time, when the
  # version bump/tag/GitHub release have already gone out but `npm publish`
  # fails.
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm ci --prefix client
      - run: npm run build
