name: Teams bug notifications

# GitHub Actions cron runs in UTC and has no DST awareness, so each Rome
# local target time is scheduled twice - once for CET (UTC+1) and once for
# CEST (UTC+2). Whichever one doesn't match the actual current Europe/Rome
# hour is a no-op (see the "Decide trigger" step) rather than double-firing.
#
#   09:00 Europe/Rome -> 07:00 UTC (CEST) / 08:00 UTC (CET)
#   14:00 Europe/Rome -> 12:00 UTC (CEST) / 13:00 UTC (CET)
#   17:45 Europe/Rome -> 15:45 UTC (CEST) / 16:45 UTC (CET)
on:
  schedule:
    - cron: "0 7 * * 1-5"
    - cron: "0 8 * * 1-5"
    - cron: "0 12 * * 1-5"
    - cron: "0 13 * * 1-5"
    - cron: "45 15 * * 1-5"
    - cron: "45 16 * * 1-5"
  workflow_dispatch:
    inputs:
      trigger:
        description: Force a specific trigger instead of deciding from the current time
        type: choice
        options: [auto, bugs-created, verifica]
        default: auto

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Decide trigger
        id: decide
        run: |
          forced="${{ github.event.inputs.trigger }}"
          if [ -n "$forced" ] && [ "$forced" != "auto" ]; then
            echo "target=$forced" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hour=$(TZ=Europe/Rome date +%H)
          case "$hour" in
            09|14) target=verifica ;;
            17) target=bugs-created ;;
            *) target=none ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Call bugs-created-today
        if: steps.decide.outputs.target == 'bugs-created'
        run: |
          curl -sf --max-time 120 --retry 2 --retry-delay 5 \
            -X POST "https://azure-dashboard-fg.onrender.com/internal/notify/bugs-created-today" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"

      - name: Call verifica-check
        if: steps.decide.outputs.target == 'verifica'
        run: |
          curl -sf --max-time 120 --retry 2 --retry-delay 5 \
            -X POST "https://azure-dashboard-fg.onrender.com/internal/notify/verifica-check" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
